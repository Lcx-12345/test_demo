<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatic Dissolution - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }
        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
        }
        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .control-section { margin-bottom: 32px; }
        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }
        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }
        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }
        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }
        .color-group { margin-bottom: 16px; }
        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }
        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }
        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }
        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Chromatic Dissolution</h1>
            <div class="subtitle">Flowing particles dissolve colors into emergent gradients</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>
                
                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="5000" step="100" value="2000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">2000</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="turbulence" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('turbulence', this.value)">
                        <span class="value-display" id="turbulence-value">1.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Scale</label>
                    <div class="slider-container">
                        <input type="range" id="flowScale" min="0.002" max="0.015" step="0.001" value="0.006" oninput="updateParam('flowScale', this.value)">
                        <span class="value-display" id="flowScale-value">0.006</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Color Speed</label>
                    <div class="slider-container">
                        <input type="range" id="colorSpeed" min="0.005" max="0.05" step="0.005" value="0.02" oninput="updateParam('colorSpeed', this.value)">
                        <span class="value-display" id="colorSpeed-value">0.02</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Length</label>
                    <div class="slider-container">
                        <input type="range" id="trailLength" min="5" max="50" step="5" value="20" oninput="updateParam('trailLength', this.value)">
                        <span class="value-display" id="trailLength-value">20</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Attraction</label>
                    <div class="slider-container">
                        <input type="range" id="attraction" min="0" max="1" step="0.1" value="0.5" oninput="updateParam('attraction', this.value)">
                        <span class="value-display" id="attraction-value">0.5</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>
                
                <div class="color-group">
                    <label>Primary Hue</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#d97757" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#d97757</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Secondary Hue</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#6a9bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#6a9bcc</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Accent Hue</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#9b59b6" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#9b59b6</span>
                    </div>
                </div>

                <div class="color-group">
                    <label>Background</label>
                    <div class="color-picker-container">
                        <input type="color" id="bgColor" value="#0a0a0f" onchange="updateColor('bgColor', this.value)">
                        <span class="color-value" id="bgColor-value">#0a0a0f</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing Chromatic Dissolution...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 42,
            particleCount: 2000,
            turbulence: 1.5,
            flowScale: 0.006,
            colorSpeed: 0.02,
            trailLength: 20,
            attraction: 0.5,
            colorPalette: ['#d97757', '#6a9bcc', '#9b59b6'],
            bgColor: '#0a0a0f'
        };

        let defaultParams = {...params};

        let particles = [];
        let time = 0;
        let scl = 8;
        let cols, rows;
        let flowField = [];

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            time = 0;

            particles = [];
            cols = floor(width / scl);
            rows = floor(height / scl);

            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new Particle());
            }

            generateFlowField();

            let bg = params.bgColor;
            background(
                parseInt(bg.slice(1, 3), 16),
                parseInt(bg.slice(3, 5), 16),
                parseInt(bg.slice(5, 7), 16)
            );
        }

        function generateFlowField() {
            flowField = [];
            for (let i = 0; i < cols * rows; i++) {
                flowField.push(createVector(0, 0));
            }
        }

        function draw() {
            let bg = params.bgColor;
            let bgR = parseInt(bg.slice(1, 3), 16);
            let bgG = parseInt(bg.slice(3, 5), 16);
            let bgB = parseInt(bg.slice(5, 7), 16);

            // Semi-transparent background for trails
            fill(bgR, bgG, bgB, 25);
            noStroke();
            rect(0, 0, width, height);

            // Update flow field
            let yoff = 0;
            for (let y = 0; y < rows; y++) {
                let xoff = 0;
                for (let x = 0; x < cols; x++) {
                    let index = x + y * cols;

                    // Multiple octaves of noise for complex flow
                    let n1 = noise(xoff * params.flowScale, yoff * params.flowScale, time * 0.3) * TWO_PI;
                    let n2 = noise(xoff * params.flowScale * 2.1, yoff * params.flowScale * 2.1, time * 0.4 + 100) * TWO_PI;
                    let n3 = noise(xoff * params.flowScale * 0.5, yoff * params.flowScale * 0.5, time * 0.2 + 200) * TWO_PI;

                    let angle = (n1 + n2 * 0.5 + n3 * 0.25) * params.turbulence;
                    let vx = cos(angle);
                    let vy = sin(angle);

                    // Add subtle radial attraction
                    let cx = width / 2;
                    let cy = height / 2;
                    let dx = x * scl - cx;
                    let dy = y * scl - cy;
                    let dist = sqrt(dx * dx + dy * dy) + 0.001;
                    let attrForce = params.attraction * 0.02;

                    vx += (dx / dist) * attrForce;
                    vy += (dy / dist) * attrForce;

                    flowField[index].x = vx;
                    flowField[index].y = vy;

                    xoff += params.flowScale;
                }
                yoff += params.flowScale;
            }

            // Update and display particles
            for (let p of particles) {
                p.follow(flowField);
                p.update();
                p.edges();
                p.display();
            }

            time += params.colorSpeed;
        }

        class Particle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = 2.5;
                this.prevPos = this.pos.copy();

                // Hue based on initial position
                this.hueBase = random(360);
                this.hueOffset = random(60) - 30;
            }

            follow(flowField) {
                let x = floor(this.pos.x / scl);
                let y = floor(this.pos.y / scl);
                let index = constrain(x + y * cols, 0, flowField.length - 1);

                let force = flowField[index];
                this.acc.add(force);
            }

            update() {
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.prevPos = this.pos.copy();
                this.pos.add(this.vel);
                this.acc.mult(0);
            }

            edges() {
                if (this.pos.x < 0) {
                    this.pos.x = width;
                    this.prevPos.x = width;
                }
                if (this.pos.x > width) {
                    this.pos.x = 0;
                    this.prevPos.x = 0;
                }
                if (this.pos.y < 0) {
                    this.pos.y = height;
                    this.prevPos.y = height;
                }
                if (this.pos.y > height) {
                    this.pos.y = 0;
                    this.prevPos.y = 0;
                }
            }

            display() {
                // Dynamic hue based on velocity and time
                let speed = this.vel.mag();
                let hue = (this.hueBase + speed * 50 + time * 30 + this.hueOffset) % 360;
                let sat = map(speed, 0, this.maxSpeed, 60, 100);
                let bri = map(speed, 0, this.maxSpeed, 50, 100);

                // Blend between palette colors
                let t = (sin(time * 2 + this.hueBase * 0.01) + 1) * 0.5;
                let colorIndex = floor((this.hueBase / 360) * 2.99);
                let c1 = params.colorPalette[colorIndex % 3];
                let c2 = params.colorPalette[(colorIndex + 1) % 3];

                let r1 = parseInt(c1.slice(1, 3), 16);
                let g1 = parseInt(c1.slice(3, 5), 16);
                let b1 = parseInt(c1.slice(5, 7), 16);
                let r2 = parseInt(c2.slice(1, 3), 16);
                let g2 = parseInt(c2.slice(3, 5), 16);
                let b2 = parseInt(c2.slice(5, 7), 16);

                let r = lerp(r1, r2, t);
                let g = lerp(g1, g2, t);
                let b = lerp(b1, b2, t);

                // Velocity-based alpha for trail effect
                let alpha = map(speed, 0, this.maxSpeed, 80, 200);
                alpha = constrain(alpha, 80, 200);

                stroke(r, g, b, alpha);
                strokeWeight(map(speed, 0, this.maxSpeed, 1, 2.5));

                // Limit trail length
                let trailLen = params.trailLength;
                let d = dist(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
                if (d > trailLen) {
                    this.prevPos.x = this.pos.x - (this.vel.x / this.vel.mag()) * trailLen;
                    this.prevPos.y = this.pos.y - (this.vel.y / this.vel.mag()) * trailLen;
                }

                line(this.pos.x, this.pos.y, this.prevPos.x, this.prevPos.y);
            }
        }

        function updateParam(paramName, value) {
            let numValue = parseFloat(value);
            params[paramName] = numValue;
            document.getElementById(paramName + '-value').textContent = 
                Number.isInteger(numValue) ? numValue : numValue.toFixed(
                    paramName === 'flowScale' || paramName === 'colorSpeed' ? 3 : 1
                );

            // If particle count changed, rebuild system
            if (paramName === 'particleCount') {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            if (colorId === 'bgColor') {
                params.bgColor = value;
            } else {
                params.colorPalette[parseInt(colorId.slice(-1)) - 1] = value;
            }
            document.getElementById(colorId + '-value').textContent = value;
            background(
                parseInt(params.bgColor.slice(1, 3), 16),
                parseInt(params.bgColor.slice(3, 5), 16),
                parseInt(params.bgColor.slice(5, 7), 16)
            );
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = {...defaultParams};

            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('turbulence').value = params.turbulence;
            document.getElementById('turbulence-value').textContent = params.turbulence;
            document.getElementById('flowScale').value = params.flowScale;
            document.getElementById('flowScale-value').textContent = params.flowScale;
            document.getElementById('colorSpeed').value = params.colorSpeed;
            document.getElementById('colorSpeed-value').textContent = params.colorSpeed;
            document.getElementById('trailLength').value = params.trailLength;
            document.getElementById('trailLength-value').textContent = params.trailLength;
            document.getElementById('attraction').value = params.attraction;
            document.getElementById('attraction-value').textContent = params.attraction;

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];
            document.getElementById('bgColor').value = params.bgColor;
            document.getElementById('bgColor-value').textContent = params.bgColor;

            updateSeedDisplay();
            initializeSystem();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
