<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态渐变卡片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: 420px;
      padding: 48px 40px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(99, 102, 241, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(99, 102, 241, 0.1), transparent 30%);
      animation: spin 6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .card-content { position: relative; z-index: 1; }
    .card h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 12px;
    }
    .card p {
      font-size: 15px;
      line-height: 1.7;
      color: #94a3b8;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
    }
    .orb-1 { width: 160px; height: 160px; background: #6366f1; top: -40px; right: -40px; }
    .orb-2 { width: 120px; height: 120px; background: #ec4899; bottom: -30px; left: -30px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="card-content">
      <h1>你好，世界</h1>
      <p>这是一张带有动态渐变光效的暗色卡片，使用纯 CSS 实现旋转光晕与模糊光球效果。</p>
      <button class="btn">了解更多</button>
    </div>
  </div>
</body>
</html>
